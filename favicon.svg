<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6fa5" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6e6e6" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4" />
    </filter>

  </defs>

  <rect width="100" height="100" rx="20" fill="url(#gradientBg)" />

  <circle cx="85" cy="15" r="8" fill="#ffffff" fill-opacity="0.1" />
  <circle cx="15" cy="85" r="12" fill="#ffffff" fill-opacity="0.05" />

  <g filter="url(#shadow)" transform="translate(50, 49)">
    <text x="-30" y="0" font-family="'Arial', sans-serif" font-size="28" font-weight="bold" text-anchor="middle"
      fill="url(#textGradient)">A</text>
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="28" font-weight="bold" text-anchor="middle"
      fill="url(#textGradient)">C</text>
    <text x="30" y="0" font-family="'Arial', sans-serif" font-size="28" font-weight="bold" text-anchor="middle"
      fill="url(#textGradient)">R</text>
  </g>

  <path d="M25 75 L75 75" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" />

</svg>