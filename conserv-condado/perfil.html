<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - CONSERV CONDADO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>

<body class="bg-secondary min-h-screen">
  <header class="bg-primary text-white p-4 flex justify-between items-center shadow-lg fixed top-0 w-full z-50">
    <h1 class="text-xl font-bold tracking-wide">CONSERV CONDADO</h1>
    <img src="assets/img/logo.png" alt="Logotipo" class="h-10 w-auto">
  </header>

  <main class="container mx-auto px-4 py-6 pt-24 pb-24">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-primary mb-2">Meu Perfil</h2>
      <p class="text-gray-600 text-sm">Gerencie suas informações e acompanhe suas solicitações</p>
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
      <!-- Card de Informações Pessoais -->
      <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-100">
        <div class="flex items-center mb-6">
          <div class="w-12 h-12 bg-primary bg-opacity-10 rounded-full flex items-center justify-center mr-4">
            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 class="text-xl font-bold text-gray-800">Informações Pessoais</h3>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-4">
            <div class="bg-gray-50 p-4 rounded-lg">
              <p class="text-sm font-semibold text-gray-500 mb-1">Nome Completo</p>
              <p class="text-lg font-medium text-gray-800" id="perfilNome">Carregando...</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg">
              <p class="text-sm font-semibold text-gray-500 mb-1">Email</p>
              <p class="text-lg font-medium text-gray-800" id="perfilEmail">Carregando...</p>
            </div>
          </div>
          <div class="bg-gray-50 p-4 rounded-lg">
            <p class="text-sm font-semibold text-gray-500 mb-1">Endereço</p>
            <p class="text-lg font-medium text-gray-800" id="perfilEndereco">Carregando...</p>
          </div>
        </div>
      </div>

      <!-- Card de Estatísticas -->
      <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-100">
        <div class="flex items-center mb-6">
          <div class="w-12 h-12 bg-primary bg-opacity-10 rounded-full flex items-center justify-center mr-4">
            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
              </path>
            </svg>
          </div>
          <h3 class="text-xl font-bold text-gray-800">Minhas Solicitações</h3>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div
            class="bg-gradient-to-br from-orange-50 to-orange-100 p-6 rounded-xl border border-orange-200 text-center">
            <div
              class="w-12 h-12 bg-orange-500 bg-opacity-20 rounded-full flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <p class="text-4xl font-bold text-orange-600 mb-1" id="solicitacoesPendentes">0</p>
            <p class="text-orange-700 font-medium text-sm">Pendentes</p>
          </div>

          <div class="bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-xl border border-green-200 text-center">
            <div
              class="w-12 h-12 bg-green-500 bg-opacity-20 rounded-full flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <p class="text-4xl font-bold text-green-600 mb-1" id="solicitacoesConcluidas">0</p>
            <p class="text-green-700 font-medium text-sm">Concluídas</p>
          </div>
        </div>
      </div>

      <!-- Card de Histórico -->
      <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-100">
        <div class="flex items-center mb-6">
          <div class="w-12 h-12 bg-primary bg-opacity-10 rounded-full flex items-center justify-center mr-4">
            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
              </path>
            </svg>
          </div>
          <h3 class="text-xl font-bold text-gray-800">Histórico de Serviços</h3>
        </div>

        <div id="historicoServicos" class="space-y-4">
          <!-- Conteúdo será inserido dinamicamente via JavaScript -->
        </div>
      </div>
    </div>
  </main>

  <nav
    class="bg-primary text-white p-3 flex justify-around items-center shadow-xl fixed bottom-0 w-full z-50 border-t border-green-600">
    <a href="home.html"
      class="flex flex-col items-center text-xs nav-link p-3 rounded-lg hover:bg-green-700 hover:bg-opacity-50 transition-all duration-200 min-w-0 flex-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0l7-7 7 7M19 10v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="font-medium">Home</span>
    </a>
    <a href="solicitar-servico.html"
      class="flex flex-col items-center text-xs nav-link p-3 rounded-lg hover:bg-green-700 hover:bg-opacity-50 transition-all duration-200 min-w-0 flex-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="font-medium">Solicitar</span>
    </a>
    <a href="perfil.html"
      class="flex flex-col items-center text-xs active-nav-link p-3 rounded-lg hover:bg-green-700 hover:bg-opacity-50 transition-all duration-200 min-w-0 flex-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="font-medium">Perfil</span>
    </a>
    <a href="sobre.html"
      class="flex flex-col items-center text-xs nav-link p-3 rounded-lg hover:bg-green-700 hover:bg-opacity-50 transition-all duration-200 min-w-0 flex-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="font-medium">Sobre</span>
    </a>
  </nav>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/servicos.js"></script>
</body>

</html>
