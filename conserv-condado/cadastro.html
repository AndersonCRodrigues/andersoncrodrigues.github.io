<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - CONSERV CONDADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>

<body class="bg-secondary min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg border border-gray-100">
        <div class="flex justify-center mb-8">
            <img src="assets/img/logo.png" alt="Logotipo CONSERV CONDADO" class="h-20 w-auto">
        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary mb-2">Cadastro de Usuário</h1>
            <p class="text-gray-600 text-sm">Crie sua conta para acessar os serviços</p>
        </div>

        <form id="cadastroForm" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="nome" class="block text-gray-700 text-sm font-semibold mb-2">Nome</label>
                    <input type="text" id="nome" name="nome"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                        placeholder="Seu nome" required>
                </div>
                <div>
                    <label for="sobrenome" class="block text-gray-700 text-sm font-semibold mb-2">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                        placeholder="Seu sobrenome" required>
                </div>
            </div>

            <div>
                <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                    placeholder="seu@email.com" required>
            </div>

            <div>
                <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Senha</label>
                <input type="password" id="password" name="password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                    placeholder="Digite sua senha" required>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Endereço</h3>

                <div class="mb-4">
                    <label for="rua" class="block text-gray-700 text-sm font-semibold mb-2">Rua</label>
                    <input type="text" id="rua" name="rua"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                        placeholder="Nome da rua" required>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="numero" class="block text-gray-700 text-sm font-semibold mb-2">Número</label>
                        <input type="text" id="numero" name="numero"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                            placeholder="123" required>
                    </div>
                    <div>
                        <label for="lote" class="block text-gray-700 text-sm font-semibold mb-2">Lote</label>
                        <input type="text" id="lote" name="lote"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                            placeholder="10">
                    </div>
                    <div>
                        <label for="quadra" class="block text-gray-700 text-sm font-semibold mb-2">Quadra</label>
                        <input type="text" id="quadra" name="quadra"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 text-gray-700 placeholder-gray-400"
                            placeholder="A">
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-primary text-white font-bold py-4 px-6 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-primary focus:ring-opacity-50 transition-all duration-200 transform hover:scale-[1.02] shadow-lg">
                Criar Conta
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-600 text-sm">
                Já possui conta?
                <a href="index.html"
                    class="text-primary font-semibold hover:text-green-700 hover:underline transition-colors duration-200">
                    Faça login aqui
                </a>
            </p>
        </div>
    </div>

    <div id="modal"
        class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div
            class="bg-white rounded-2xl p-8 shadow-2xl max-w-md w-full text-center transform transition-all duration-300 scale-95 border border-gray-100">
            <div class="mb-6">
                <div
                    class="mx-auto w-16 h-16 bg-primary bg-opacity-10 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 id="modalTitle" class="text-2xl font-bold mb-2 text-gray-800"></h2>
                <p id="modalMessage" class="text-gray-600 leading-relaxed"></p>
            </div>
            <button id="closeModal"
                class="bg-primary text-white font-semibold py-3 px-8 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-primary focus:ring-opacity-50 transition-all duration-200 transform hover:scale-105">
                Entendi
            </button>
        </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
