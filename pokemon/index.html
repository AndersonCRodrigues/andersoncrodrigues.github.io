<body class="bg-gray-100 min-h-screen">
  <header class="bg-red-600 text-white shadow-lg">
    <div class="container mx-auto p-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold">PokéExplorer</h1>
      <div class="flex items-center gap-4">
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Buscar pokémon..."
            class="px-4 py-2 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-yellow-400 w-64">
          <button id="searchButton" class="absolute right-3 top-2.5 text-gray-500">
            <i class="fas fa-search"></i>
          </button>
        </div>
        <button id="randomButton" class="bg-yellow-400 hover:bg-yellow-500 text-gray-800 px-4 py-2 rounded-full
                                             font-bold transition-colors duration-300">
          Pokémon Aleatório
        </button>
      </div>
    </div>
  </header>
  <main class="container mx-auto p-4">
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Pokédex</h2>
        <div class="flex gap-2">
          <select id="limitSelector" class="bg-gray-100 border border-gray-300 rounded-md px-3 py-2 text-gray-700">
            <option value="20">20 por página</option>
            <option value="50">50 por página</option>
            <option value="100">100 por página</option>
          </select>
          <select id="typeFilter" class="bg-gray-100 border border-gray-300 rounded-md px-3 py-2 text-gray-700">
            <option value="">Todos os tipos</option>
          </select>
        </div>
      </div>
      <div id="loading" class="flex justify-center items-center py-20 hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-red-600"></div>
      </div>
      <div id="pokemonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      </div>
      <div class="flex justify-between items-center mt-6">
        <button id="prevButton"
          class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md
                                            font-bold transition-colors duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
          Anterior
        </button>
        <span id="pageInfo" class="text-gray-600">Página 1</span>
        <button id="nextButton" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md
                                            font-bold transition-colors duration-300">
          Próximo
        </button>
      </div>
    </div>
  </main>
  <footer class="bg-gray-800 text-white py-6">
    <div class="container mx-auto px-4 text-center">
      <p>PokéExplorer - Dados fornecidos pela <a href="https://pokeapi.co" target="_blank"
          class="text-yellow-400 hover:underline">PokeAPI</a></p>
      <p class="mt-2 text-gray-400">© 2025 Anderson Rodrigues. Todos os direitos reservados.</p>
    </div>
  </footer>
  <script src="src/index.js"></script>
</body>

</html>
