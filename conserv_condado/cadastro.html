<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - CONSERV CONDADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-secondary min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <div class="flex justify-center mb-6">
            <img src="assets/img/logo.png" alt="Logotipo CONSERV CONDADO" class="h-16">
        </div>
        <h1 class="text-2xl font-bold text-center text-primary mb-6">Cadastro de Usuário</h1>
        <form id="cadastroForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="nome" class="block text-gray-700 text-sm font-bold mb-2">Nome</label>
                    <input type="text" id="nome" name="nome"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>
                <div>
                    <label for="sobrenome" class="block text-gray-700 text-sm font-bold mb-2">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" name="email"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <input type="password" id="password" name="password"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    required>
            </div>
            <div class="mb-4">
                <label for="rua" class="block text-gray-700 text-sm font-bold mb-2">Rua</label>
                <input type="text" id="rua" name="rua"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    required>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label for="numero" class="block text-gray-700 text-sm font-bold mb-2">Número</label>
                    <input type="text" id="numero" name="numero"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        required>
                </div>
                <div>
                    <label for="lote" class="block text-gray-700 text-sm font-bold mb-2">Lote</label>
                    <input type="text" id="lote" name="lote"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div>
                    <label for="quadra" class="block text-gray-700 text-sm font-bold mb-2">Quadra</label>
                    <input type="text" id="quadra" name="quadra"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
            </div>
            <button type="submit"
                class="w-full bg-primary text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline hover:opacity-90 transition-opacity">Cadastrar</button>
        </form>
        <p class="text-center text-gray-600 text-sm mt-4">Já possui conta? <a href="index.html"
                class="text-primary hover:underline">Acesse</a></p>
    </div>

    <div id="modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 shadow-xl max-w-sm w-full text-center">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 text-primary"></h2>
            <p id="modalMessage" class="text-gray-700 mb-6"></p>
            <button id="closeModal"
                class="bg-primary text-white font-bold py-2 px-4 rounded hover:opacity-90 transition-opacity">Ok</button>
        </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
