<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Serviço - CONSERV CONDADO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-secondary flex flex-col min-h-screen">
  <header class="bg-primary text-white p-4 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold">CONSERV CONDADO</h1>
    <img src="assets/img/logo.png" alt="Logotipo" class="h-10">
  </header>

  <main class="flex-grow p-4 pb-20 md:pb-4">
    <h2 class="text-2xl font-bold text-primary mb-6 text-center">Nova Solicitação de Serviço</h2>
    <form id="solicitarServicoForm" class="bg-white p-6 rounded-lg shadow-lg max-w-lg mx-auto">
      <div class="mb-4">
        <label for="titulo" class="block text-gray-700 text-sm font-bold mb-2">Título</label>
        <input type="text" id="titulo" name="titulo"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          required>
      </div>
      <div class="mb-4">
        <label for="descricao" class="block text-gray-700 text-sm font-bold mb-2">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          maxlength="200" required></textarea>
        <p class="text-xs text-gray-500 mt-1">Máximo de 200 caracteres.</p>
      </div>
      <div class="mb-4">
        <label for="tipoServico" class="block text-gray-700 text-sm font-bold mb-2">Tipo de Serviço</label>
        <select id="tipoServico" name="tipoServico"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          required>
          <option value="">Selecione...</option>
          <option value="Roçada">Roçada</option>
          <option value="Capina">Capina</option>
          <option value="Varrição">Varrição</option>
          <option value="Poda de galhos">Poda de galhos</option>
          <option value="Coleta de resíduo verde">Coleta de resíduo verde</option>
          <option value="Projeto horta orgânica comunitária">Projeto horta orgânica comunitária</option>
          <option value="É plantando que se colhe">É plantando que se colhe</option>
          <option value="Limpeza de bueiros">Limpeza de bueiros</option>
          <option value="Coleta de RCC">Coleta de RCC</option>
          <option value="Coleta de RSU">Coleta de RSU</option>
          <option value="Caiação">Caiação</option>
          <option value="Instalação de lixeirinhas">Instalação de lixeirinhas</option>
          <option value="Conscientização e Dicas">Conscientização e Dicas para o CONSERV CONDADO</option>
        </select>
      </div>
      <div class="mb-4">
        <label for="rua" class="block text-gray-700 text-sm font-bold mb-2">Rua</label>
        <input type="text" id="rua" name="rua"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          required>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label for="numero" class="block text-gray-700 text-sm font-bold mb-2">Número</label>
          <input type="text" id="numero" name="numero"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            required>
        </div>
        <div>
          <label for="lote" class="block text-gray-700 text-sm font-bold mb-2">Lote</label>
          <input type="text" id="lote" name="lote"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
          <label for="quadra" class="block text-gray-700 text-sm font-bold mb-2">Quadra</label>
          <input type="text" id="quadra" name="quadra"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
      </div>
      <div class="mb-6">
        <label for="imagem" class="block text-gray-700 text-sm font-bold mb-2">Imagem (URL)</label>
        <input type="text" id="imagem" name="imagem"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
      </div>
      <button type="submit"
        class="w-full bg-primary text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline hover:opacity-90 transition-opacity">Solicitar
        Serviço</button>
    </form>
  </main>

  <nav class="bg-primary text-white p-4 flex justify-around items-center shadow-lg">
    <a href="home.html"
      class="flex flex-col items-center text-sm nav-link p-2 rounded-md hover:bg-opacity-80 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m0 0l7-7 7 7M19 10v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>
    <a href="solicitar-servico.html"
      class="flex flex-col items-center text-sm active-nav-link p-2 rounded-md hover:bg-opacity-80 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Solicitar</span>
    </a>
    <a href="perfil.html"
      class="flex flex-col items-center text-sm nav-link p-2 rounded-md hover:bg-opacity-80 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span>Perfil</span>
    </a>
    <a href="sobre.html"
      class="flex flex-col items-center text-sm nav-link p-2 rounded-md hover:bg-opacity-80 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Sobre</span>
    </a>
  </nav>

  <div id="modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg p-6 shadow-xl max-w-sm w-full text-center">
      <h2 id="modalTitle" class="text-xl font-bold mb-4 text-primary"></h2>
      <p id="modalMessage" class="text-gray-700 mb-6"></p>
      <button id="closeModal"
        class="bg-primary text-white font-bold py-2 px-4 rounded hover:opacity-90 transition-opacity">Ok</button>
    </div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/servicos.js"></script>
</body>

</html>
