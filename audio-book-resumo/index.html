<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loucos pela Vida — Guia de Estudos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap');

    :root {
      --bg: #1c1a17;
      --surface: #252218;
      --card: #2d2920;
      --border: #3d3828;
      --accent: #d4a853;
      --dim: #8a6e35;
      --text: #ede8df;
      --muted: #8a8070
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 17px;
      line-height: 1.7;
      min-height: 100vh
    }

    header {
      background: var(--surface);
      border-bottom: 2px solid var(--dim);
      padding: 24px 20px 18px;
      text-align: center
    }

    .tag {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 6px
    }

    h1 {
      font-family: 'Lora', serif;
      font-size: clamp(20px, 5vw, 38px);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2
    }

    h1 em {
      color: var(--accent);
      font-style: italic
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
      padding: 0 8px
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 12px 13px 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, border-color .2s;
      position: relative;
      bottom: -1px;
      -webkit-tap-highlight-color: transparent
    }

    .tab:hover {
      color: var(--text)
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent)
    }

    .main {
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 16px 80px
    }

    .panel {
      display: none
    }

    .panel.active {
      display: block;
      animation: up .3s ease
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .chapter-sub {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 7px
    }

    .chapter-title {
      font-family: 'Lora', serif;
      font-size: clamp(17px, 4vw, 26px);
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.3
    }

    /* PLAYER */
    .player {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #1a1208;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: bold;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform .1s;
      user-select: none
    }

    .play-btn:active {
      transform: scale(0.9)
    }

    .player-meta {
      flex: 1;
      min-width: 80px
    }

    .player-track {
      font-weight: 600;
      font-size: 14px;
      color: var(--text)
    }

    .player-state {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      min-height: 18px
    }

    .stop-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    .stop-btn:active {
      border-color: #e74c3c;
      color: #e74c3c
    }

    .prog-wrap {
      margin-top: 10px
    }

    .prog-bar {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden
    }

    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--dim), var(--accent));
      width: 0%;
      border-radius: 3px;
      transition: width .4s linear
    }

    .ctrl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding-top: 10px;
      margin-top: 8px;
      border-top: 1px solid var(--border)
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .ctrl-group label {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap
    }

    select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      max-width: 200px
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer
    }

    .speed-val {
      font-size: 11px;
      color: var(--accent);
      min-width: 32px
    }

    /* SUMMARY */
    .summary-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 20px 18px 16px;
      margin-bottom: 22px
    }

    .box-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .box-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .summary-content {
      font-size: 15.5px;
      line-height: 1.9;
      color: var(--text)
    }

    .summary-content p {
      margin-bottom: 14px
    }

    .summary-content p:last-child {
      margin-bottom: 0
    }

    /* LOADING */
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      flex-direction: column;
      gap: 16px;
      color: var(--muted)
    }

    .spinner-lg {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .err-screen {
      text-align: center;
      padding: 40px 20px;
      color: #e57373
    }

    .err-screen code {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted)
    }

    /* NO TTS */
    .no-tts {
      background: #2a1a1a;
      border: 1px solid #5a2020;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #e57373;
      margin-top: 8px;
      display: none
    }
  </style>
</head>

<body>

  <header>
    <span class="tag">Guia de Estudos</span>
    <h1><em>Loucos</em> pela Vida</h1>
    <p class="subtitle">A Trajetória da Reforma Psiquiátrica no Brasil · Paulo Amarante · FIOCRUZ, 1998</p>
  </header>

  <div id="tabs-bar" class="tabs"></div>
  <div class="main" id="main-content">
    <div class="loading-screen">
      <div class="spinner-lg"></div>
      <div>Carregando resumos…</div>
    </div>
  </div>

  <script>
    // ── Carrega o JSON de resumos ──────────────────────────
    async function init() {
      try {
        const res = await fetch('resumos.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        buildUI(data);
      } catch (e) {
        document.getElementById('main-content').innerHTML = `
      <div class="err-screen">
        <div>⚠ Não foi possível carregar o arquivo <strong>resumos.json</strong></div>
        <div style="margin-top:12px;font-size:14px;color:var(--muted)">
          Certifique-se de que <code>resumos.json</code> está na mesma pasta que este HTML.
        </div>
        <code>${e.message}</code>
      </div>`;
      }
    }

    // ── Monta a interface com os dados do JSON ─────────────
    function buildUI(data) {
      const sections = Object.values(data);
      const tabsBar = document.getElementById('tabs-bar');
      const main = document.getElementById('main-content');
      main.innerHTML = '';

      sections.forEach((sec, idx) => {
        // Tab
        const tab = document.createElement('button');
        tab.className = 'tab' + (idx === 0 ? ' active' : '');
        tab.textContent = sec.tab;
        tab.onclick = () => showPanel(idx, tab);
        tabsBar.appendChild(tab);

        // Parágraos do resumo
        const parasHTML = sec.summary
          .split(/\n\n+/)
          .filter(p => p.trim())
          .map(p => `<p>${p.trim()}</p>`)
          .join('');

        // Painel
        const panel = document.createElement('div');
        panel.className = 'panel' + (idx === 0 ? ' active' : '');
        panel.id = 'panel-' + idx;
        panel.innerHTML = `
      <div class="chapter-sub">${sec.sub}</div>
      <h2 class="chapter-title">${sec.title}</h2>

      <div class="player">
        <div class="player-top">
          <button class="play-btn" id="play-${idx}" onclick="ttsToggle(${idx})">▶</button>
          <div class="player-meta">
            <div class="player-track">Narração do Resumo</div>
            <div class="player-state" id="st-${idx}">Toque ▶ para ouvir</div>
          </div>
          <button class="stop-btn" onclick="ttsStop()">■</button>
        </div>
        <div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" id="pg-${idx}"></div></div></div>
        ${idx === 0 ? `
        <div class="ctrl-row">
          <div class="ctrl-group"><label>Voz:</label><select id="voice-sel"></select></div>
          <div class="ctrl-group"><label>Vel.:</label>
            <input type="range" id="speed" min="0.5" max="2.0" step="0.05" value="1.0"
              oninput="document.getElementById('sv').textContent=parseFloat(this.value).toFixed(2)+'×'">
            <span class="speed-val" id="sv">1.0×</span>
          </div>
        </div>` : ''}
        <div class="no-tts" id="no-tts-${idx}"></div>
      </div>

      <div class="summary-box">
        <div class="box-label">Resumo</div>
        <div class="summary-content">${parasHTML}</div>
      </div>
    `;
        main.appendChild(panel);
      });

      // Guarda os textos de resumo para o TTS
      window.SUMMARIES = sections.map(s => s.summary);
      loadVoices();
    }

    function showPanel(idx, btn) {
      ttsStop();
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + idx).classList.add('active');
      btn.classList.add('active');
    }

    // ── TTS ────────────────────────────────────────────────
    const HAS_TTS = (() => {
      try { return 'speechSynthesis' in window && typeof window.speechSynthesis.speak === 'function'; }
      catch (e) { return false; }
    })();

    let voices = [], ttsActive = false, ttsPaused = false;
    let ttsChapter = -1, ttsChunks = [], ttsPos = 0, ttsTotal = 0;

    function loadVoices() {
      if (!HAS_TTS) return;
      const v = window.speechSynthesis.getVoices();
      if (!v.length) return;
      voices = v;
      const sel = document.getElementById('voice-sel');
      if (!sel) return;
      sel.innerHTML = '';
      const pt = v.filter(x => x.lang.startsWith('pt-BR'));
      const ptAny = v.filter(x => x.lang.startsWith('pt'));
      const pool = pt.length ? pt : ptAny.length ? ptAny : v;
      pool.forEach(x => {
        const o = document.createElement('option');
        o.value = v.indexOf(x);
        o.textContent = x.name + ' (' + x.lang + ')';
        sel.appendChild(o);
      });
    }
    if (HAS_TTS) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices(); setTimeout(loadVoices, 600); setTimeout(loadVoices, 1500);
    }
    function getVoice() {
      const sel = document.getElementById('voice-sel');
      if (!sel || !voices.length) return null;
      const i = parseInt(sel.value);
      return isNaN(i) ? null : (voices[i] || null);
    }
    function getRate() {
      const r = document.getElementById('speed');
      return r ? parseFloat(r.value) : 1.0;
    }
    function setUI(idx, txt, pct) {
      const s = document.getElementById('st-' + idx);
      const p = document.getElementById('pg-' + idx);
      if (s && txt !== null) s.textContent = txt;
      if (p && pct !== null) p.style.width = pct + '%';
    }
    function makeChunks(text) {
      const sents = text.match(/[^.!?]+[.!?]+/g) || [text];
      const out = []; let cur = '';
      sents.forEach(s => {
        s = s.trim(); if (!s) return;
        const j = cur ? cur + ' ' + s : s;
        if (j.length > 300 && cur) { out.push(cur); cur = s; } else cur = j;
      });
      if (cur.trim()) out.push(cur.trim());
      return out.length ? out : [text];
    }
    function speakChunk(idx) {
      if (!ttsActive || ttsChapter !== idx) return;
      if (ttsPos >= ttsTotal) {
        ttsActive = false; ttsChapter = -1;
        document.getElementById('play-' + idx).textContent = '▶';
        setUI(idx, 'Concluído ✓', 100);
        setTimeout(() => setUI(idx, 'Toque ▶ para ouvir', 0), 2000);
        return;
      }
      const pct = Math.round((ttsPos / ttsTotal) * 100);
      setUI(idx, 'Lendo… ' + pct + '%', pct);
      const u = new SpeechSynthesisUtterance(ttsChunks[ttsPos]);
      const v = getVoice(); if (v) u.voice = v;
      u.lang = 'pt-BR'; u.rate = getRate(); u.pitch = 1; u.volume = 1;
      const ci = idx, cp = ttsPos;
      u.onend = () => { if (!ttsActive || ttsChapter !== ci) return; ttsPos = cp + 1; speakChunk(ci); };
      u.onerror = (e) => {
        if (e.error === 'canceled' || e.error === 'interrupted') return;
        if (ttsActive && ttsChapter === ci) { ttsPos = cp + 1; speakChunk(ci); }
      };
      window.speechSynthesis.speak(u);
    }
    function ttsToggle(idx) {
      if (!HAS_TTS) {
        const el = document.getElementById('no-tts-' + idx);
        if (el) { el.style.display = 'block'; el.textContent = '⚠ Síntese de voz não disponível. Abra no Chrome.'; }
        return;
      }
      if (!window.SUMMARIES || !window.SUMMARIES[idx]) return;
      const ss = window.speechSynthesis;
      if (ttsChapter === idx && ttsActive) {
        if (ttsPaused) {
          ss.resume(); ttsPaused = false;
          document.getElementById('play-' + idx).textContent = '⏸';
          setUI(idx, 'Lendo…', null);
        } else {
          ss.pause(); ttsPaused = true;
          document.getElementById('play-' + idx).textContent = '▶';
          setUI(idx, 'Pausado', null);
        }
        return;
      }
      ttsStop(); loadVoices();
      ttsChapter = idx;
      ttsChunks = makeChunks(window.SUMMARIES[idx]);
      ttsPos = 0; ttsTotal = ttsChunks.length;
      ttsActive = true; ttsPaused = false;
      document.getElementById('play-' + idx).textContent = '⏸';
      setUI(idx, 'Lendo… 0%', 0);
      speakChunk(idx);
    }
    function ttsStop() {
      ttsActive = false; ttsPaused = false;
      if (HAS_TTS) { try { window.speechSynthesis.cancel(); } catch (e) { } }
      if (ttsChapter >= 0) {
        const i = ttsChapter; ttsChapter = -1;
        const btn = document.getElementById('play-' + i);
        if (btn) btn.textContent = '▶';
        setUI(i, 'Toque ▶ para ouvir', 0);
      }
    }

    init();
  </script>
</body>

</html>
